<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedShield — Offline Mode</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FAF6EC;
      color: #23302A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #FFFDF7;
      border: 1px solid #F3EDDD;
      border-radius: 16px;
      padding: 32px;
      max-width: 440px;
      box-shadow: 0 4px 20px -2px rgba(35, 48, 42, 0.05);
    }
    .badge {
      display: inline-block;
      background: #E4EBDD;
      color: #1F4D3A;
      font-weight: 600;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 24px;
      color: #1F4D3A;
      margin: 0 0 12px 0;
    }
    p {
      color: #6E7A70;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      background: #1F4D3A;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Offline Active</div>
    <h1>Working Without Internet</h1>
    <p>FeedShield works offline in the field. You can continue taking sample photos and testing silage fermentation using our on-device engines. All results will sync automatically when connectivity returns.</p>
    <a href="/" class="btn">Open Saved Samples</a>
  </div>
</body>
</html>
